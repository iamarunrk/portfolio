<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Background engine</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b0b0d; color: #e8e8ea; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body.full { overflow: hidden; height: 100%; }
      canvas.stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #hud { position: fixed; left: 10px; top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(10,10,14,.62);
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: calc(100vw - 40px); z-index: 2; }
      #hud select, #hud button { font: inherit; background: #1b1b22; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 2px 4px; margin: 2px 2px 2px 0; }
      #hud .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
      .grid-page { padding: 16px; }
      .grid-page h2 { font-size: 13px; margin: 22px 0 10px; color: #aaa; font-weight: 600; letter-spacing: .02em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      .grid.cols3 { grid-template-columns: 140px repeat(3, minmax(200px, 1fr)); align-items: center; }
      .grid figure { margin: 0; }
      .grid img { width: 100%; display: block; border-radius: 8px; background: #222; }
      .grid figcaption { margin-top: 4px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .grid .rowlabel { color: #ddd; font-weight: 600; }
    </style>
  </head>
  <body>
    <script type="module" src="./bg.ts"></script>
  </body>
</html>
