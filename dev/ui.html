<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>UI chrome · dev harness</title>
    <script>
      // ?fresh = first visit: must run before the store module reads storage.
      if (/[?&]fresh\b/.test(location.search)) {
        try {
          localStorage.removeItem('once-upon-a-time:v1');
          localStorage.removeItem('once-upon-a-time:hint');
        } catch (e) {}
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      #bg {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #bg canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* stand-in for the hero headline so the chrome is judged in context */
      .dev-headline {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-size: clamp(42px, 7vw, 120px);
        line-height: 0.92;
        letter-spacing: -0.025em;
        text-align: center;
        color: #fbfaf7;
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.28);
        padding: 0 4vw;
      }
      .dev-headline[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div class="dev-headline" id="headline">Once upon a time<br />i was a product designer</div>
    <div id="root"></div>
    <script type="module" src="./ui.tsx"></script>
  </body>
</html>
