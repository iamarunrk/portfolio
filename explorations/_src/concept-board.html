  // ── confetti easter egg ─────────────────────────────────────────────────
  function confetti() {
    const ctx = confettiCv.getContext('2d');

    confettiCv.width = W() * dpr; confettiCv.height = H() * dpr;
    const cols = ['#d7ff3a', '#ff4fd8', '#46c8ff', '#ffd23f', '#ff6b1a', '#ffffff'];
    const ps = Array.from({ length: 140 }, () => ({ x: W() / 2, y: H() * 0.55, vx: (Math.random() - 0.5) * 16, vy: -8 - Math.random() * 14, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0] }));
    const t0 = performance.now();
    const step = (now) => {
      const t = (now - t0) / 1000;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W(), H());
      ps.forEach((p) => { p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });

  }

  // ── toast ────────────────────────────────────────────────────────────────
  let toastT = 0;

  }

  // ── follow a collaborator ───────────────────────────────────────────────
  function startFollow(i) {

    toast(`Following ${CURSORS[i].name} · Esc to stop`, 4000);
  }
  function stopFollow() { if (follow >= 0) { follow = -1; } }
  const cursorPos = (c, t) => ({ x: c.cx + Math.sin(t * c.sp * 2 + c.ph) * c.rx, y: c.cy + Math.sin(t * c.sp * 3.1 + c.ph * 1.7) * c.ry });

  // ── tour: auto-scroll the story ─────────────────────────────────────────

  const miniJump = (e) => {
    const r = miniSvg.getBoundingClientRect();
    const s = Math.min(r.width / BW, r.height / BH);

  // keyboard shortcuts (when the board is on screen or exploring)
  addEventListener('keydown', (e) => {

    const k = e.key.toLowerCase();
    if (k === 'escape') { if (follow >= 0) { stopFollow(); toast('Stopped following'); } else exitExplore(); return; }
    if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); undo(); return; }

  // ── render loop (only while on screen) ──────────────────────────────────

    let target;

    const k = direct ? 1 : 1 - Math.exp(-dt * 12);

    cam.cx = lerp(cam.cx, target.cx, k); cam.cy = lerp(cam.cy, target.cy, k);
    cam.z = Math.exp(lerp(Math.log(cam.z), Math.log(target.z), k));

    const z = cam.z, tx = W() / 2 - cam.cx * z, ty = H() / 2 - cam.cy * z;
    board.style.transform = `translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, 0) scale(${z.toFixed(5)})`;
    board.style.setProperty('--s', z.toFixed(5));
    stage.style.setProperty('--dot', `${Math.max(8, 48 * z).toFixed(1)}px`);
    stage.style.backgroundPosition = `${tx.toFixed(1)}px ${ty.toFixed(1)}px, 0 0`;
    zoomTxt.textContent = `${Math.round(z * 100)}%`;
    vp.setAttribute('x', (-tx / z).toFixed(0)); vp.setAttribute('y', (-ty / z).toFixed(0));
    vp.setAttribute('width', (W() / z).toFixed(0)); vp.setAttribute('height', (H() / z).toFixed(0));

    cursorEls.forEach((el, i) => {
      const c = cursorPos(CURSORS[i], tsec);
      el.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) scale(${(1 / z).toFixed(4)})`;
      el.style.opacity = showCursors ? '1' : '0';
    });

    const msg = mode === 'explore'
      ? (tool === 'marker' ? 'Draw anywhere. <b>⌘Z</b> undoes. It saves in your browser.'
        : tool === 'stamp' ? 'Click a piece to stamp it. Stamp <b>5</b> for a surprise.'
        : tool === 'note' ? 'Click anywhere to stick a note.'
        : tool === 'move' ? 'Drag frames around. <b>Tidy up</b> puts them back.'
        : 'Scroll pans · <b>⌘/Ctrl+scroll</b> or pinch zooms · <b>Esc</b> returns to the story.')
      : p < 0.12 ? 'Scroll: the header pulls back into the <b>board</b>.'
      : p < 0.68 ? 'Press <b>E</b> (or pick a tool) to step into the board.'
      : p < 0.9 ? '<b>▶</b> on a product frame opens its case study.'
      : 'Stamp, doodle, leave a note. Make the board yours.';
    if (tip.dataset.msg !== msg) { tip.dataset.msg = msg; tip.innerHTML = msg; }

    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; if (visible) start(); }, { rootMargin: '100px' }).observe(track);

  ghost.innerHTML = STAMPS[stampKind];
  load();
  renderTools();
})();
</script>
